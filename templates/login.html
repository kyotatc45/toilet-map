
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者ログイン | 大学トイレ検索</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 300px;
            padding: 25px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h1>管理者ログイン</h1>

        <form action="/admin/login" method="post">
{% if error %}
    <p>{{ error }}</p>
{% endif %}
            <label for="password">パスワード</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="パスワードを入力"
                required
            >

            <button type="submit">ログイン</button>
        </form>

        <a href="{{ url_for('top') }}" class="back-link">
            トップ画面に戻る
        </a>
    </div>
</body>
</html>
