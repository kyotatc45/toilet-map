
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大学トイレ検索</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 30px;
        }

        .search-button {
            padding: 15px 40px;
            font-size: 18px;
            cursor: pointer;
        }

        .admin-button {
            position: absolute;
            right: 15px;
            bottom: 15px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>大学トイレ検索</h1>

    <p>大学内のトイレを簡単に検索できます。</p>

    <form action="{{ url_for('index') }}" method="get">
        <button type="submit" class="search-button">
            トイレを検索する
        </button>
    </form>

    <form action="/admin" method="get"
      style="position: absolute; right: 15px; bottom: 15px;">
    <button type="submit" class="admin-button">
        管理者ログイン
    </button>
</form>
</body>
</html>
